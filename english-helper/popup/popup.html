<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 15px;
        font-family: "Segoe UI", sans-serif;
      }
      .form-group {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #64748b;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: green;
        text-align: center;
        height: 16px;
      }
      .dash-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #2563eb;
        text-decoration: none;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h3>设置</h3>
    <div class="form-group">
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div class="form-group">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="githubToken" placeholder="ghp_..." />
    </div>
    <div class="form-group">
      <label>Gist ID (自动生成)</label>
      <input
        type="text"
        id="gistId"
        readonly
        placeholder="配置 Token 后自动生成"
        style="background: #f1f5f9"
      />
    </div>

    <div class="form-group">
      <label>域名白名单 (每行一个，留空则匹配所有)(只控制启用高亮功能)</label>
      <textarea
        id="whitelist"
        rows="4"
        placeholder="example.com&#10;github.com"
        style="
          width: 100%;
          padding: 6px;
          box-sizing: border-box;
          border: 1px solid #e2e8f0;
          border-radius: 4px;
          font-family: inherit;
        "
      ></textarea>
    </div>

    <button id="saveBtn">保存配置</button>
    <div id="status" class="status"></div>

    <a href="#" id="openDashboard" class="dash-link">打开单词本仪表盘 -></a>

    <script src="popup.js"></script>
  </body>
</html>
